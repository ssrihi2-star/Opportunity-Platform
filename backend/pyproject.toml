[project]
name = "ois-backend"
version = "0.2.0"
description = "Opportunity Intelligence System - backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "structlog>=24.1",
  "email-validator>=2.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "aiosqlite>=0.20",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
]
vector = ["pgvector>=0.2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Migrations are Alembic-generated and then hand-audited. Their column tables are
# machine-formatted; reflowing them makes the diff against a fresh autogenerate
# unreadable, which is the one thing a migration file has to stay good at.
"alembic/*" = ["E501", "I001", "F401"]
"tests/*" = ["S", "E501"]
# Long lines below are data tables and regex literals that are clearer unwrapped.
"scripts/*" = ["S", "E501"]
"app/core/sanitize.py" = ["E501"]
"app/sources/adapters/demo_mock.py" = ["E501"]
# The scenario definition table is a data table; wrapping it would hide its shape.
"app/sources/adapters/scenario.py" = ["E501"]
# The transport takes an explicit timeout because httpx owns timeout handling;
# wrapping it in asyncio.timeout would double-manage cancellation.
"app/sources/http.py" = ["ASYNC109"]
"tests/test_http_fetcher.py" = ["ASYNC109", "S", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
